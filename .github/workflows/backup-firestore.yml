name: Backup diário para o Google Drive

on:
  schedule:
    # 06:00 UTC = 03:00 em Belém (UTC-3)
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  backup:
    name: Exportar Firestore e enviar ao Drive
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gravar credenciais do Firebase
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/firebase-sa.json

      - name: Gerar e enviar backup
        run: node scripts/backup-firestore-drive.mjs
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-sa.json
          FIREBASE_PROJECT_ID: controle-de-procesos
          DRIVE_BACKUP_FOLDER_ID: ${{ secrets.DRIVE_BACKUP_FOLDER_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}

      - name: Remover credenciais temporárias
        if: always()
        run: rm -f /tmp/firebase-sa.json
