name: Atualizar índice de busca pública

on:
  schedule:
    # A cada hora
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  atualizar:
    name: Reconstruir busca_publica a partir de processos e contratos
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gravar credenciais do Firebase
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/firebase-sa.json

      - name: Atualizar índice
        run: node scripts/atualizar-busca-publica.mjs
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-sa.json
          FIREBASE_PROJECT_ID: controle-de-procesos

      - name: Remover credenciais temporárias
        if: always()
        run: rm -f /tmp/firebase-sa.json
