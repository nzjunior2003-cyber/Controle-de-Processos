name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    name: Typecheck, lint, testes e build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Checagem de tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build

  deploy:
    name: Deploy para a VPS
    needs: verificar
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH (git pull + docker compose)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 46.202.149.184
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /root/controle-processos
            git pull origin main
            docker compose build
            docker compose up -d

  deploy-firestore-rules:
    name: Publicar regras do Firestore
    needs: verificar
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Gravar credenciais do Firebase
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/firebase-sa.json

      - name: Publicar firestore.rules
        run: npx firebase-tools deploy --only firestore:rules --project controle-de-procesos --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-sa.json

      - name: Remover credenciais temporárias
        if: always()
        run: rm -f /tmp/firebase-sa.json
